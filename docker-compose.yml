services:
  # ─────────────────────────────────────────────
  # PWA Frontend (Nginx reverse proxy + static)
  # Public entrypoint on port 80 (terminate TLS here or at a managed edge — see nginx/nginx.tls.conf.example)
  # ─────────────────────────────────────────────
  pwa-frontend:
    # Pinned by digest (tag kept for readability). Bump deliberately after review.
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: qr_guard_pwa
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/snippets:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    # Read-only rootfs; only nginx's cache/pid/tmp dirs are writable (RAM).
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    # Master process needs to bind :80 and drop to the nginx user; nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    networks:
      - edge
      - app

  # ─────────────────────────────────────────────
  # FastAPI API Gateway (Upload Security Gate)
  # Internal only — port 8000 NOT published to host
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qr_guard_api
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --loop asyncio
      --no-server-header --ws-max-size 4096 --timeout-keep-alive 5 --limit-concurrency 300
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - REDIS_URL_FILE=/run/secrets/redis_url
      - STORAGE_PATH=/app/storage
      - WECHAT_QR_MODEL_DIR=/app/models/wechat_qr
      # Starlette spools multipart bodies > 1 MB to TMPDIR. Keep that on disk
      # (dedicated volume), not on the 128 MB RAM tmpfs below.
      - TMPDIR=/app/spool
    secrets:
      - redis_url
    volumes:
      - shared-storage:/app/storage
      - upload-spool:/app/spool
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      - redis-broker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 200
    restart: unless-stopped
    # The API never calls the Internet; it only talks to nginx (app) and Redis (backend),
    # both internal networks.
    networks:
      - app
      - backend

  # ─────────────────────────────────────────────
  # Celery Worker (Hardened Isolation Boundary)
  # Heavy compute: PDF, QR Decode, ML Sensor, TI
  # ─────────────────────────────────────────────
  processing-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qr_guard_worker
    command: >-
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --pool=threads
      -O fair
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_URL_FILE=/run/secrets/redis_url
      - STORAGE_PATH=/app/storage
      - WECHAT_QR_MODEL_DIR=/app/models/wechat_qr
      - PADDLE_OCR_LANG=vi
      - QR_DECODE_MODE=fast
      # Local IOC feed built by scripts/build_ioc_feed.py (absent file => layer "not configured").
      # The SHA-256 pin TI_LOCAL_FEED_SHA256 lives in .env (written with --write-env).
      - TI_LOCAL_FEED_PATH=/app/ti_feed/ioc_feed.jsonl
    secrets:
      - redis_url
    volumes:
      - shared-storage:/app/storage
      - ./ti_feed:/app/ti_feed:ro
    depends_on:
      - redis-broker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only rootfs. Models (WeChat, PaddleOCR) are baked into the image and only read;
    # scratch files go to /tmp (RAM) and uploads to the shared-storage volume.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 4096M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d \"celery@$$HOSTNAME\" -t 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend

  # ─────────────────────────────────────────────
  # Redis: Message Broker + Event/Result Store + job state
  # - ACL users (default user disabled), no host port, internal network only
  # - No persistence: uploaded payment data / results never written to disk (RDB/AOF)
  # ─────────────────────────────────────────────
  redis-broker:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: qr_guard_redis
    user: "999:1000"    # run as the image's redis user directly (no chown/su-exec needed with cap_drop ALL)
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 640M
    restart: unless-stopped
    networks:
      - backend

secrets:
  redis_url:
    file: ./secrets/redis_url

volumes:
  shared-storage:
  upload-spool:

networks:
  edge:
    driver: bridge      # public side: only nginx (published port 80/443)
  app:
    driver: bridge
    internal: true      # nginx <-> API only; the API has no route to the Internet
  backend:
    driver: bridge
    internal: true      # no route to the Internet; Redis is never reachable from outside
