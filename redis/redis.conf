# QR Guard Redis configuration (mounted read-only into the redis container)
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication & authorisation: users are defined in users.acl (generated by scripts/generate_secrets.py)
aclfile /usr/local/etc/redis/users.acl

# Privacy: no persistence. Job results contain payment data (account numbers / names) and must
# not survive in RDB snapshots, AOF files or backups. Losing the queue on restart is acceptable:
# affected jobs fail and the user simply scans again.
appendonly no
save ""

# Memory: NO eviction. Security-relevant keys also carry a TTL (job owner, admission /
# stream slots, rate-limit counters, circuit breaker); an LRU policy could drop
# them under memory pressure and silently reset quotas or slots. Every key already expires on its
# own TTL, so memory stays bounded. If the limit is ever reached, writes fail and the API returns
# 503 (fail-closed) instead of losing state. Monitor `used_memory` / rejected writes in production.
maxmemory 512mb
maxmemory-policy noeviction

# Connection hygiene
timeout 300
tcp-keepalive 60
maxclients 2000
