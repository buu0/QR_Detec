# QR Guard — server body shared by nginx.conf (HTTP :80) and nginx.tls.conf.example (HTTPS :443).
# Contains request hygiene, static PWA routes and API proxy locations. Include INSIDE a server {} block.

server_tokens off;
charset utf-8;

# Request hygiene / slow-client protection
client_max_body_size 1m;          # raised only on /api/upload
client_body_timeout 30s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;
limit_conn conn_per_ip 30;

if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) {
    return 405;
}

# Gzip compression (static assets only; never compress API secrets-bearing responses)
gzip on;
gzip_types text/plain text/css application/javascript text/xml application/xml image/svg+xml application/manifest+json;
gzip_min_length 1000;

error_page 429 = @rate_limited;
error_page 413 = @too_large;

# PWA static files
root /usr/share/nginx/html;
index index.html;

# SPA routing (React fallback)
location / {
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
}

# Static assets caching (hashed filenames)
location /assets/ {
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Service Worker / manifest - always revalidate so security fixes ship immediately
location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security_headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# Upload endpoint: strict rate + max 3 concurrent uploads per IP
location = /api/upload {
    include /etc/nginx/snippets/security_headers.conf;
    # Rejected before the request body is read (see $upload_csrf_precheck)
    error_page 403 = @csrf_rejected;
    if ($upload_csrf_precheck = 0) {
        return 403;
    }
    limit_req zone=upload_limit burst=5 nodelay;
    limit_conn conn_per_ip 3;
    client_max_body_size 51m;     # 50 MB file + multipart overhead (API enforces exact limit)
    client_body_buffer_size 256k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api-gateway:8000;
    proxy_pass $upstream_api;
    proxy_set_header Host $http_host;   # keep port: API compares Origin with Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;   # slow uploads are absorbed by nginx, not the API workers
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Proxy SSE for real-time progress & progressive warnings
location /api/sse/ {
    include /etc/nginx/snippets/security_headers.conf;
    limit_req zone=general_api burst=20 nodelay;
    limit_conn conn_per_ip 10;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api-gateway:8000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;   # keep port: API compares Origin with Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 330s;      # API closes streams after STREAM_MAX_SECONDS (300s)
}

# Readiness probe touches Redis and is for internal health checks only (container healthchecks
# call api-gateway:8000 directly). It is not exposed through the public edge.
location = /api/health/ready {
    include /etc/nginx/snippets/security_headers.conf;
    return 404;
}

# Proxy API REST to FastAPI
location /api/ {
    include /etc/nginx/snippets/security_headers.conf;
    limit_req zone=general_api burst=40 nodelay;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api-gateway:8000;
    proxy_pass $upstream_api;
    proxy_set_header Host $http_host;   # keep port: API compares Origin with Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# WebSocket for real-time streaming results (Origin + session are verified by the API)
location ~ ^/(api/)?ws/ {
    include /etc/nginx/snippets/security_headers.conf;
    limit_req zone=general_api burst=20 nodelay;
    limit_conn conn_per_ip 10;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api-gateway:8000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;   # keep port: API compares Origin with Host
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 330s;
    proxy_send_timeout 60s;
}

location @rate_limited {
    include /etc/nginx/snippets/security_headers.conf;
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"error_code":"RATE_LIMITED","message":"Bạn thao tác quá nhanh.","recommended_action":"Hãy đợi vài giây rồi thử lại.","detail":"Bạn thao tác quá nhanh."}';
}

location @csrf_rejected {
    include /etc/nginx/snippets/security_headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error_code":"CSRF_REJECTED","message":"Yêu cầu không hợp lệ.","recommended_action":"Hãy tải lại trang rồi thử lại.","detail":"Yêu cầu không hợp lệ."}';
}

location @too_large {
    include /etc/nginx/snippets/security_headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error_code":"FILE_TOO_LARGE","message":"Tệp quá lớn.","recommended_action":"Hãy chọn ảnh hoặc PDF nhỏ hơn 50 MB.","detail":"Tệp quá lớn."}';
}
