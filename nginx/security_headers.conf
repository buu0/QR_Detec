# Security headers — included in EVERY location block.
# (nginx `add_header` in a location replaces, not extends, server-level headers; including this
#  snippet everywhere prevents silently losing CSP/frame protections on some routes.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# camera=(self): the in-app QR camera needs it; everything else is denied.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# No inline/remote scripts, no external fonts, WebSocket only to this host
# ($qrg_ws_src = wss only over HTTPS; see qrguard_common.conf).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' $qrg_ws_src; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS: value is empty (header omitted) on plain HTTP, set on HTTPS ($qrg_hsts in qrguard_common.conf).
add_header Strict-Transport-Security $qrg_hsts always;
