# QR Guard — http-level shared settings (rate-limit zones + maps).
# Included by BOTH nginx.conf (HTTP) and nginx.tls.conf.example (HTTPS) so the two never drift.

# Rate-limit key per client. IPv4 -> the address. IPv6 -> the /64 network, because a single
# subscriber normally owns a whole /64 and could otherwise rotate addresses to bypass limits.
# $remote_addr is nginx's canonical (RFC 5952) text form, so the first 4 groups are the /64
# whenever "::" does not occur inside them; otherwise the part before "::" is used (zeros follow).
# Worst case one /64 maps to two keys (still bounded). Behind a load balancer configure
# set_real_ip_from/real_ip_header first, or every client shares the LB address.
map $remote_addr $qrg_client_key {
    "~^(?<v6net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):"  "v6:$v6net";
    "~^(?<v6short>[0-9a-fA-F]{1,4}(?::[0-9a-fA-F]{1,4}){0,2})::"                        "v6:$v6short::";
    default                                                                            $binary_remote_addr;
}

# Rate limiting zones
limit_req_zone $qrg_client_key zone=upload_limit:10m rate=2r/s;
limit_req_zone $qrg_client_key zone=general_api:10m rate=30r/s;
# Concurrency limits (uploads in flight, open SSE/WS streams)
limit_conn_zone $qrg_client_key zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# An upload without the CSRF header is rejected BEFORE nginx reads/buffers the body
# (up to 51 MB). The API still performs the full CSRF + Origin check.
map "$request_method:$http_x_qrguard_request" $upload_csrf_precheck {
    default        0;
    "POST:1"       1;
    "~^OPTIONS:"   1;
}

# HSTS only when this nginx actually serves HTTPS (an empty value => header not sent).
# Start with 1 year; add "; preload" only after verifying every subdomain is HTTPS.
map $scheme $qrg_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Over HTTPS the CSP allows only wss:// to this host (no cleartext ws://).
map $scheme $qrg_ws_src {
    https   "wss://$host";
    default "ws://$host wss://$host";
}
