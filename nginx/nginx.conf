# QR Guard - reverse proxy + PWA static files (HTTP :80).
# For production put TLS in front (managed edge / load balancer) or use nginx.tls.conf.example.
#
# Shared pieces (mounted into /etc/nginx/snippets/ by docker-compose.yml):
#   qrguard_common.conf   rate-limit zones, maps (CSRF pre-check, HSTS, CSP ws source)
#   qrguard_server.conf   request hygiene, static routes, API proxy locations
#   security_headers.conf security headers included in every location

include /etc/nginx/snippets/qrguard_common.conf;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/qrguard_server.conf;
}
